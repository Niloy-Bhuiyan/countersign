name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # The suite runs with no API keys and no network. If this job ever needs a
      # secret, the offline provider has stopped being the default somewhere.
      - name: Test
        run: pytest -q

      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check

  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One commit identity
        run: |
          identities=$(git log --format='%an <%ae>' | sort -u)
          echo "$identities"
          test "$(echo "$identities" | wc -l)" -eq 1
