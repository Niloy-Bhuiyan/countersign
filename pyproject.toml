[project]
name = "countersign"
version = "0.1.0"
description = "Invoice-to-payment reconciliation with deterministic checks and an approval-gated agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pandas>=2.2",
    "numpy>=2.1",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["countersign*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migration scripts are generated by alembic; their style is alembic's, not ours.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The catalogue is a data table kept one row per item; its rows run long.
"data/catalogue.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
